<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--accent:#2563eb;--ok:#15803d;--ng:#b91c1c;--line:#e5e7eb;--warn:#b45309}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
main{max-width:760px;margin:auto;padding:16px 14px 44px}h1{font-size:21px;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:480px){.grid{grid-template-columns:1fr}}
label{font-size:12px;color:var(--muted)}select,button{font:inherit}select{width:100%;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:12px;background:white}
.btn{border:0;border-radius:13px;padding:13px 16px;min-height:46px;font-weight:700;background:var(--accent);color:white}.btn.secondary{background:#eef2ff;color:#1e3a8a}.btn.danger{background:#fee2e2;color:#991b1b}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{text-align:center;background:#f9fafb;border-radius:12px;padding:10px 4px}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--muted)}
.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:var(--accent)}
.meta{font-size:12px;color:var(--muted);margin:12px 0 6px}.q{font-size:20px;line-height:1.55;font-weight:700;margin:8px 0 14px}
.choice{width:100%;text-align:left;background:white;border:1px solid var(--line);border-radius:14px;padding:14px;margin:7px 0;min-height:52px;font-size:16px}
.choice.correct{border-color:var(--ok);background:#ecfdf5}.choice.wrong{border-color:var(--ng);background:#fef2f2}.choice:disabled{color:var(--text);opacity:1}
.result{padding:12px;border-radius:12px;margin-top:12px;font-weight:700}.ok{background:#ecfdf5;color:#166534}.ng{background:#fef2f2;color:#991b1b}.ex{font-weight:400;color:var(--text);margin-top:6px;line-height:1.55}
.hidden{display:none}.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1;min-width:130px}
.badge{display:inline-block;font-size:11px;padding:4px 8px;border-radius:99px;background:#eef2ff;color:#3730a3;margin-right:5px}
.note{font-size:12px;color:var(--muted);line-height:1.6}.due{color:var(--warn);font-weight:700}

.translation{margin:-4px 0 14px;padding:10px 12px;background:#f9fafb;border-left:3px solid var(--accent);border-radius:8px;font-size:15px;line-height:1.55}
.translation .label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px}
.whybox{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.whytitle{font-size:13px;font-weight:800;margin-bottom:6px}
.whyitem{font-size:13px;line-height:1.55;padding:7px 0;border-bottom:1px dashed var(--line)}
.whyitem:last-child{border-bottom:0}
.whyitem strong{display:inline-block;min-width:26px}

</style>

<script>
const CHAPTERS=[[1, "動詞", 1, 2], [2, "時制", 3, 7], [3, "助動詞", 8, 10], [4, "名詞と冠詞", 11, 11], [5, "形容詞", 12, 15], [6, "代名詞", 16, 19], [7, "副詞", 20, 22], [8, "不定詞", 23, 26], [9, "動名詞", 27, 28], [10, "分詞", 29, 30], [11, "受動態", 31, 32], [12, "疑問詞", 33, 33], [13, "比較", 34, 35], [14, "接続詞", 36, 41], [15, "仮定法", 42, 43], [16, "関係詞", 44, 46], [17, "前置詞", 47, 48], [18, "一致と倒置", 49, 49]];
const Q=[{"day":1,"ch":1,"q":"She ___ very happy after hearing the news.","c":["looked","looked at","watched","saw"],"a":0,"e":"look は「〜に見える」の意味では linking verb（補語を取る動詞）として使えます。","id":1,"type":"core","ja":"彼女はその知らせを聞いたあと、とても幸せそうだった。"},{"day":1,"ch":1,"q":"The manager ___ the proposal carefully before approving it.","c":["examined","examined about","discussed about","explained about"],"a":0,"e":"examine は他動詞なので、目的語の前に about は不要です。","id":2,"type":"core","ja":"マネージャーは承認する前に、その提案を注意深く検討した。"},{"day":2,"ch":1,"q":"The manager ___ the proposal carefully before the meeting.","c":["discussed","discussed about","explained about","suggested to"],"a":0,"e":"discuss は他動詞なので about は不要です。","id":3,"type":"core","ja":"マネージャーは会議の前に、その提案を注意深く検討した。"},{"day":2,"ch":1,"q":"Please ___ the lights before you leave.","c":["turn off","turn them off","turn off them","both A and B"],"a":3,"e":"turn off は句動詞。名詞なら turn off the lights、代名詞なら turn them off。","id":4,"type":"core","ja":"出かける前に電気を消してください。"},{"day":3,"ch":2,"q":"I ___ this laptop for three years.","c":["have had","had","am having","have"],"a":0,"e":"「3年間ずっと所有している」ので現在完了。","id":5,"type":"core","ja":"私はこのノートパソコンを3年間使っています。"},{"day":3,"ch":2,"q":"The museum ___ at 10 a.m. tomorrow.","c":["opens","will opening","is openning","opened"],"a":0,"e":"時刻表・予定として確定した未来は現在形で表せます。","id":6,"type":"core","ja":"その博物館は明日の午前10時に開館します。"},{"day":4,"ch":2,"q":"By the time we arrived, the movie ___.","c":["had started","has started","starts","was start"],"a":0,"e":"過去のある時点より前に起きたことなので過去完了。","id":7,"type":"core","ja":"私たちが到着した時には、映画はすでに始まっていました。"},{"day":4,"ch":2,"q":"I ___ dinner when the phone rang.","c":["was cooking","cooked now","have cooked","am cooking"],"a":0,"e":"過去のある時点で進行中だった動作は過去進行形。","id":8,"type":"core","ja":"電話が鳴った時、私は夕食を作っていました。"},{"day":5,"ch":2,"q":"Look at those clouds. It ___ soon.","c":["is going to rain","rains","has rained","rain"],"a":0,"e":"目の前の根拠から予測するので be going to が自然です。","id":9,"type":"core","ja":"あの雲を見て。もうすぐ雨が降りそうです。"},{"day":5,"ch":2,"q":"By next March, she ___ here for ten years.","c":["will have worked","works","has worked yesterday","will worked"],"a":0,"e":"未来のある時点までの継続は未来完了。","id":10,"type":"core","ja":"来年3月までには、彼女はここで10年間働いたことになります。"},{"day":6,"ch":2,"q":"She usually ___ to work by train.","c":["goes","is going","has gone","go"],"a":0,"e":"習慣なので現在形。主語が三人称単数なので goes。","id":11,"type":"core","ja":"彼女は普段、電車で仕事に行きます。"},{"day":6,"ch":2,"q":"I ___ him since we graduated from college.","c":["haven't seen","didn't see","don't see yesterday","wasn't seeing"],"a":0,"e":"since + 過去の起点には現在完了が自然です。","id":12,"type":"core","ja":"大学を卒業して以来、私は彼に会っていません。"},{"day":7,"ch":2,"q":"This time tomorrow, I ___ on the plane.","c":["will be sitting","sit","have sat","am sat"],"a":0,"e":"未来のある時点で進行中の動作なので未来進行形。","id":13,"type":"core","ja":"明日の今ごろ、私は飛行機に乗っているでしょう。"},{"day":7,"ch":2,"q":"She was tired because she ___ all day.","c":["had been working","has worked tomorrow","was work","would work"],"a":0,"e":"過去の時点まで続いていた動作は過去完了進行形。","id":14,"type":"core","ja":"彼女は一日中働いていたので疲れていました。"},{"day":8,"ch":3,"q":"You ___ smoke here. It is prohibited.","c":["must not","do not have to","may","should"],"a":0,"e":"must not は「〜してはいけない」。","id":15,"type":"core","ja":"ここでは喫煙してはいけません。禁止されています。"},{"day":8,"ch":3,"q":"___ I borrow your charger for a moment?","c":["May","Must","Should have","Used to"],"a":0,"e":"許可を求める丁寧な表現として May I ...? が使えます。","id":16,"type":"core","ja":"少しの間、あなたの充電器を借りてもいいですか？"},{"day":9,"ch":3,"q":"He ___ be at home; the lights are on.","c":["must","cannot","would rather","used to"],"a":0,"e":"強い推量「〜に違いない」は must。","id":17,"type":"core","ja":"彼は家にいるに違いありません。電気がついています。"},{"day":9,"ch":3,"q":"Employees ___ wear their ID badges at all times.","c":["must","might","used to","would rather"],"a":0,"e":"規則上の義務は must が自然です。","id":18,"type":"core","ja":"従業員は常にIDバッジを着用しなければなりません。"},{"day":10,"ch":3,"q":"You ___ bring any food; everything is provided.","c":["do not have to","must not","cannot","ought not"],"a":0,"e":"「持ってくる必要はない」なので do not have to。","id":19,"type":"core","ja":"食べ物を持ってくる必要はありません。すべて用意されています。"},{"day":10,"ch":3,"q":"I ___ play tennis every weekend when I was a student.","c":["used to","must","may","have to"],"a":0,"e":"過去の習慣は used to + 動詞原形。","id":20,"type":"core","ja":"学生の頃、私は毎週末テニスをしていました。"},{"day":11,"ch":4,"q":"She gave me ___ useful advice.","c":["some","an","a","many"],"a":0,"e":"advice は不可算名詞なので a/an は付けません。","id":21,"type":"core","ja":"彼女は私に役立つ助言をくれました。"},{"day":11,"ch":4,"q":"We need ___ information before making a decision.","c":["more","many","an","a few"],"a":0,"e":"information は不可算名詞なので many/an/a few は使えません。","id":22,"type":"core","ja":"決定する前に、もっと情報が必要です。"},{"day":12,"ch":5,"q":"This is a ___ difficult problem.","c":["rather","much","very much","more very"],"a":0,"e":"形容詞 difficult を修飾する副詞 rather が使えます。","id":23,"type":"core","ja":"これはかなり難しい問題です。"},{"day":12,"ch":5,"q":"There aren't ___ seats left.","c":["many","much","a little","an"],"a":0,"e":"seats は可算名詞複数なので many。","id":24,"type":"core","ja":"残っている席はあまり多くありません。"},{"day":13,"ch":5,"q":"The instructions were not clear ___.","c":["enough","too","so","such"],"a":0,"e":"形容詞 + enough の語順です。","id":25,"type":"core","ja":"その説明は十分に明確ではありませんでした。"},{"day":13,"ch":5,"q":"We have ___ time, so let's review the report once more.","c":["a little","little","a few","few"],"a":0,"e":"a little は「少しはある」。time は不可算名詞です。","id":26,"type":"core","ja":"少し時間があるので、もう一度レポートを確認しましょう。"},{"day":14,"ch":5,"q":"He is ___ to lift the box alone.","c":["strong enough","enough strong","so strong enough","too enough strong"],"a":0,"e":"形容詞 + enough + to不定詞。","id":27,"type":"core","ja":"彼はその箱を一人で持ち上げられるほど力があります。"},{"day":14,"ch":5,"q":"___ employee must complete the training.","c":["Every","All","Both of","Many a of"],"a":0,"e":"every + 単数名詞で「すべての〜」。","id":28,"type":"core","ja":"すべての従業員が研修を修了しなければなりません。"},{"day":15,"ch":5,"q":"This book is worth ___.","c":["reading","to read","read","to be read"],"a":0,"e":"be worth + 動名詞。","id":29,"type":"core","ja":"この本は読む価値があります。"},{"day":15,"ch":5,"q":"You can choose ___ option; both are acceptable.","c":["either","neither","every","no"],"a":0,"e":"2つのうちどちらでもよい、は either。","id":30,"type":"core","ja":"どちらの選択肢を選んでも構いません。どちらも問題ありません。"},{"day":16,"ch":6,"q":"___ of the two answers is correct.","c":["Neither","None","No one","Nothing"],"a":0,"e":"2つのうちどちらも〜ない、は neither。","id":31,"type":"core","ja":"2つの答えのどちらも正しくありません。"},{"day":16,"ch":6,"q":"The weather in Osaka is warmer than ___ in Sapporo.","c":["that","it one","those one","this"],"a":0,"e":"同じ種類の名詞 weather の繰り返しを避けるため that を使います。","id":32,"type":"core","ja":"大阪の天気は札幌の天気より暖かいです。"},{"day":17,"ch":6,"q":"The two sisters help ___.","c":["each other","themselves each","one","another one"],"a":0,"e":"2人がお互いに、は each other。","id":33,"type":"core","ja":"その姉妹2人は互いに助け合っています。"},{"day":17,"ch":6,"q":"___ is important to back up your files regularly.","c":["It","One","That one","Those"],"a":0,"e":"形式主語 It を使い、真の主語は to back up ...。","id":34,"type":"core","ja":"定期的にファイルをバックアップすることは重要です。"},{"day":18,"ch":6,"q":"I have two pens. You may use ___.","c":["either","both one","any one","neither one"],"a":0,"e":"2つのうちどちらでも、は either。","id":35,"type":"core","ja":"ペンを2本持っています。どちらを使ってもいいですよ。"},{"day":18,"ch":6,"q":"The population of this city is larger than ___ of that city.","c":["that","it","one","those"],"a":0,"e":"population の繰り返しを避ける代名詞は that。","id":36,"type":"core","ja":"この都市の人口は、あの都市の人口より多いです。"},{"day":19,"ch":6,"q":"Everyone should bring ___ own ID.","c":["their","its","his only","our"],"a":0,"e":"単数扱いの everyone を受ける代名詞として singular they が自然です。","id":37,"type":"core","ja":"全員が自分のIDを持参する必要があります。"},{"day":19,"ch":6,"q":"Some people prefer tea; ___ prefer coffee.","c":["others","another","the other one people","other"],"a":0,"e":"不特定多数の「ほかの人々」は others。","id":38,"type":"core","ja":"紅茶を好む人もいれば、コーヒーを好む人もいます。"},{"day":20,"ch":7,"q":"He speaks English very ___.","c":["fluently","fluent","fluency","more fluent"],"a":0,"e":"動詞 speaks を修飾するので副詞 fluently。","id":39,"type":"core","ja":"彼は英語をとても上手に話します。"},{"day":20,"ch":7,"q":"I met her two years ___.","c":["ago","before from now","yet","still"],"a":0,"e":"現在から見て「〜前」は ago。","id":40,"type":"core","ja":"私は2年前に彼女に会いました。"},{"day":21,"ch":7,"q":"I have ___ finished my homework.","c":["already","yet","still not to","ever not"],"a":0,"e":"肯定文の「もう」は already が自然です。","id":41,"type":"core","ja":"私はちょうど宿題を終えたところです。"},{"day":21,"ch":7,"q":"The box is ___ heavy for one person to carry.","c":["too","so much","almost of","enough"],"a":0,"e":"too + 形容詞 + to do で「〜するには…すぎる」。","id":42,"type":"core","ja":"その箱は1人で運ぶには重すぎます。"},{"day":22,"ch":7,"q":"She is ___ late for meetings.","c":["hardly ever","hard ever","almost ever","scarce ever"],"a":0,"e":"hardly ever = めったに〜ない。","id":43,"type":"core","ja":"彼女は会議にほとんど遅刻しません。"},{"day":22,"ch":7,"q":"He hardly ___ complains about his workload.","c":["ever","never not","almost","either"],"a":0,"e":"hardly ever = めったに〜ない。","id":44,"type":"core","ja":"彼は仕事量について文句を言うことはほとんどありません。"},{"day":23,"ch":8,"q":"I decided ___ abroad next year.","c":["to study","studying","study","to studying"],"a":0,"e":"decide は to不定詞を取ります。","id":45,"type":"core","ja":"私は来年、海外へ行くことを決めました。"},{"day":23,"ch":8,"q":"Her goal is ___ a small business.","c":["to start","start","started","to starting"],"a":0,"e":"be動詞の補語として to不定詞の名詞的用法が使えます。","id":46,"type":"core","ja":"彼女の目標は小さな会社を始めることです。"},{"day":24,"ch":8,"q":"This box is too heavy for me ___.","c":["to carry","carrying","carry","to carrying"],"a":0,"e":"too ... to 〜「〜するには…すぎる」。","id":47,"type":"core","ja":"この箱は私が運ぶには重すぎます。"},{"day":24,"ch":8,"q":"I was surprised ___ the news.","c":["to hear","hearing to","hear","for heard"],"a":0,"e":"感情を表す形容詞の原因を to不定詞で表せます。","id":48,"type":"core","ja":"私はその知らせを聞いて驚きました。"},{"day":25,"ch":8,"q":"He seems ___ the answer.","c":["to know","knowing","know","to knowing"],"a":0,"e":"seem + to不定詞。","id":49,"type":"core","ja":"彼は答えを知っているようです。"},{"day":25,"ch":8,"q":"Could you tell me ___ to use this machine?","c":["how","what is","that how","which is how"],"a":0,"e":"how to do =「どのように〜するか」。","id":50,"type":"core","ja":"この機械の使い方を教えてもらえますか？"},{"day":26,"ch":8,"q":"I went to the station ___ my friend.","c":["to meet","meeting","met","for meet"],"a":0,"e":"目的を表す to不定詞。","id":51,"type":"core","ja":"私は友達に会うため駅へ行きました。"},{"day":26,"ch":8,"q":"The teacher made us ___ the exercise again.","c":["do","to do","doing","done"],"a":0,"e":"make + O + 動詞原形。","id":52,"type":"core","ja":"先生は私たちにその練習問題をもう一度やらせました。"},{"day":27,"ch":9,"q":"Would you mind ___ the window?","c":["opening","to open","open","opened"],"a":0,"e":"mind + 動名詞。","id":53,"type":"core","ja":"窓を開けてもらっても構いませんか？"},{"day":27,"ch":9,"q":"I appreciate ___ invited to the meeting.","c":["being","to be","be","been"],"a":0,"e":"appreciate の後ろは動名詞。受動なので being invited。","id":54,"type":"core","ja":"会議に招待していただきありがとうございます。"},{"day":28,"ch":9,"q":"He avoided ___ about the issue.","c":["talking","to talk","talk","to talking"],"a":0,"e":"avoid + 動名詞。","id":55,"type":"core","ja":"彼はその問題について話すのを避けました。"},{"day":28,"ch":9,"q":"Remember ___ the door when you leave.","c":["to lock","locking yesterday","lock to","locked"],"a":0,"e":"remember to do は「これから〜するのを忘れない」。","id":56,"type":"core","ja":"出かける時にドアに鍵をかけるのを忘れないでください。"},{"day":29,"ch":10,"q":"The news was very ___.","c":["surprising","surprised","surprise","to surprise"],"a":0,"e":"物事が人を驚かせる性質なので -ing。","id":57,"type":"core","ja":"その知らせはとても驚くべきものでした。"},{"day":29,"ch":10,"q":"The man ___ by the window is our new director.","c":["standing","stood by someone","stand","to stood"],"a":0,"e":"能動の意味で名詞を修飾するので現在分詞 standing。","id":58,"type":"core","ja":"窓のそばに立っている男性が、私たちの新しい取締役です。"},{"day":30,"ch":10,"q":"___ in 1920, the building is still in use.","c":["Built","Building","Build","Having build"],"a":0,"e":"建物は「建てられた」ので過去分詞 Built。","id":59,"type":"core","ja":"1920年に建てられたその建物は、今も使われています。"},{"day":30,"ch":10,"q":"___ the email, she called the client immediately.","c":["Having read","Read","To reading","Hav a":0,"e":"TOEIC類題｜不特定多数の「ほかの人々」は others。","type":"toeic","ja":"紅茶を好む人もいれば、コーヒーを好む人もいます。"},{"id":118,"day":20,"ch":7,"q":"I met her two years ___.","c":["ago","before from now","yet","still"],"a":0,"e":"TOEIC類題｜現在から見て「〜前」は ago。","type":"toeic","ja":"私は2年前に彼女に会いました。"},{"id":119,"day":21,"ch":7,"q":"The box is ___ heavy for one person to carry.","c":["too","so much","almost of","enough"],"a":0,"e":"TOEIC類題｜too + 形容詞 + to do で「〜するには…すぎる」。","type":"toeic","ja":"その箱は1人で運ぶには重すぎます。"},{"id":120,"day":22,"ch":7,"q":"He hardly ___ complains about his workload.","c":["ever","never not","almost","either"],"a":0,"e":"TOEIC類題｜hardly ever = めったに〜ない。","type":"toeic","ja":"彼は仕事量について文句を言うことはほとんどありません。"},{"id":121,"day":23,"ch":8,"q":"Her goal is ___ a small business.","c":["to start","start","started","to starting"],"a":0,"e":"TOEIC類題｜be動詞の補語として to不定詞の名詞的用法が使えます。","type":"toeic","ja":"彼女の目標は小さな会社を始めることです。"},{"id":122,"day":24,"ch":8,"q":"I was surprised ___ the news.","c":["to hear","hearing to","hear","for heard"],"a":0,"e":"TOEIC類題｜感情を表す形容詞の原因を to不定詞で表せます。","type":"toeic","ja":"私はその知らせを聞いて驚きました。"},{"id":123,"day":25,"ch":8,"q":"Could you tell me ___ to use this machine?","c":["how","what is","that how","which is how"],"a":0,"e":"TOEIC類題｜how to do =「どのように〜するか」。","type":"toeic","ja":"この機械の使い方を教えてもらえますか？"},{"id":124,"day":26,"ch":8,"q":"The teacher made us ___ the exercise again.","c":["do","to do","doing","done"],"a":0,"e":"TOEIC類題｜make + O + 動詞原形。","type":"toeic","ja":"先生は私たちにその練習問題をもう一度やらせました。"},{"id":125,"day":27,"ch":9,"q":"I appreciate ___ invited to the meeting.","c":["being","to be","be","been"],"a":0,"e":"TOEIC類題｜appreciate の後ろは動名詞。受動なので being invited。","type":"toeic","ja":"会議に招待していただきありがとうございます。"},{"id":126,"day":28,"ch":9,"q":"Remember ___ the door when you leave.","c":["to lock","locking yesterday","lock to","locked"],"a":0,"e":"TOEIC類題｜remember to do は「これから〜するのを忘れない」。","type":"toeic","ja":"出かける時にドアに鍵をかけるのを忘れないでください。"},{"id":127,"day":29,"ch":10,"q":"The man ___ by the window is our new director.","c":["standing","stood by someone","stand","to stood"],"a":0,"e":"TOEIC類題｜能動の意味で名詞を修飾するので現在分詞 standing。","type":"toeic","ja":"窓のそばに立っている男性が、私たちの新しい取締役です。"},{"id":128,"day":30,"ch":10,"q":"___ the email, she called the client immediately.","c":["Having read","Read","To reading","Having reading"],"a":0,"e":"TOEIC類題｜先に完了した動作を強調する分詞構文は Having + 過去分詞。","type":"toeic","ja":"メールを読んだあと、彼女はすぐに顧客へ電話しました。"},{"id":129,"day":31,"ch":11,"q":"The documents ___ before the meeting starts.","c":["must be submitted","must submit","must be submit","are must submitted"],"a":0,"e":"TOEIC類題｜documents は提出される側なので助動詞 + be + 過去分詞。","type":"toeic","ja":"会議が始まる前に、書類を提出しなければなりません。"},{"id":130,"day":32,"ch":11,"q":"He is known ___ his careful work.","c":["for","by of","to as","with"],"a":0,"e":"TOEIC類題｜be known for =「〜で知られている」。","type":"toeic","ja":"彼は丁寧な仕事ぶりで知られています。"},{"id":131,"day":33,"ch":12,"q":"Can you tell me ___ the nearest station is?","c":["where","where is","what place is","that where"],"a":0,"e":"TOEIC類題｜間接疑問では疑問詞 + 主語 + 動詞の語順。","type":"toeic","ja":"最寄り駅がどこか教えてもらえますか？"},{"id":132,"day":34,"ch":13,"q":"This year's sales are ___ higher than last year's.","c":["much","very","more very","many"],"a":0,"e":"TOEIC類題｜比較級 higher の強調には much を使えます。","type":"toeic","ja":"今年の売上は昨年よりずっと高いです。"},{"id":133,"day":35,"ch":13,"q":"This is one of ___ restaurants in the area.","c":["the best","best","better","the better than"],"a":0,"e":"TOEIC類題｜one of the + 最上級 + 複数名詞。","type":"toeic","ja":"これはこの地域で最も良いレストランの1つです。"},{"id":134,"day":36,"ch":14,"q":"The office was small, ___ it was comfortable.","c":["but","because of","despite","during"],"a":0,"e":"TOEIC類題｜2つの節を対比で結ぶ等位接続詞 but。","type":"toeic","ja":"そのオフィスは小さかったですが、快適でした。"},{"id":135,"day":37,"ch":14,"q":"I don't know ___ he will attend the meeting.","c":["whether","despite","during","because of"],"a":0,"e":"TOEIC類題｜「〜かどうか」の名詞節は whether/if。","type":"toeic","ja":"彼が会議に出席するかどうか、私は知りません。"},{"id":136,"day":38,"ch":14,"q":"Please stay here ___ I return.","c":["until","by","during","for"],"a":0,"e":"TOEIC類題｜「私が戻るまでずっと」は until + 節。","type":"toeic","ja":"私が戻るまでここにいてください。"},{"id":137,"day":39,"ch":14,"q":"We left early ___ we could avoid the traffic.","c":["so that","because of","despite","such that of"],"a":0,"e":"TOEIC類題｜目的「〜するために」は so that + 主語 + 動詞。","type":"toeic","ja":"渋滞を避けられるように、私たちは早めに出発しました。"},{"id":138,"day":40,"ch":14,"q":"The presentation was ___ interesting that everyone stayed until the end.","c":["so","such an","too much","enough"],"a":0,"e":"TOEIC類題｜so + 形容詞 + that ... の結果構文。","type":"toeic","ja":"そのプレゼンはとても興味深かったので、全員が最後まで残りました。"},{"id":139,"day":41,"ch":14,"q":"___ he was busy, he answered all my questions.","c":["Although","Despite","Because of","During"],"a":0,"e":"TOEIC類題｜後ろが節なので although。","type":"toeic","ja":"彼は忙しかったにもかかわらず、私の質問すべてに答えてくれました。"},{"id":140,"day":42,"ch":15,"q":"The doctor recommended that he ___ more rest.","c":["get","gets","gotten","will gets"],"a":0,"e":"TOEIC類題｜提案・要求などに続く that節では動詞原形を使うことがあります。","type":"toeic","ja":"医師は彼にもっと休息を取るよう勧めました。"},{"id":141,"day":43,"ch":15,"q":"Without your help, I ___ the project on time.","c":["couldn't have finished","can't finished","will not finish yesterday","hadn't finish"],"a":0,"e":"TOEIC類題｜過去の反実仮想を without で表す形。","type":"toeic","ja":"あなたの助けがなければ、私はそのプロジェクトを期限内に終えられなかったでしょう。"},{"id":142,"day":44,"ch":16,"q":"The person ___ I spoke to was very helpful.","c":["whom","which","what","whose is"],"a":0,"e":"TOEIC類題｜先行詞が人で目的格なので whom（会話では who も可）。","type":"toeic","ja":"私が話した人はとても親切でした。"},{"id":143,"day":45,"ch":16,"q":"This is exactly ___ I needed.","c":["what","that what","which what","who"],"a":0,"e":"TOEIC類題｜what =「〜するもの／こと」で先行詞を含みます。","type":"toeic","ja":"これはまさに私が必要としていたものです。"},{"id":144,"day":46,"ch":16,"q":"___ wants to join the tour must register today.","c":["Whoever","Whatever person which","Whichever is person","No matter what person is"],"a":0,"e":"TOEIC類題｜Whoever =「〜する人は誰でも」。","type":"toeic","ja":"ツアーに参加したい人は誰でも今日中に登録しなければなりません。"},{"id":145,"day":47,"ch":17,"q":"The report must be finished ___ Friday.","c":["by","until during","for","since"],"a":0,"e":"TOEIC類題｜締切「金曜までに」は by。","type":"toeic","ja":"レポートは金曜日までに仕上げなければなりません。"},{"id":146,"day":48,"ch":17,"q":"We discussed the issue ___ the meeting.","c":["during","for","by","until"],"a":0,"e":"TOEIC類題｜「会議の間に」は during + 名詞。","type":"toeic","ja":"私たちは会議中にその問題について話し合いました。"},{"id":147,"day":49,"ch":18,"q":"Not only the staff but also the manager ___ attending.","c":["is","are","be","were all"],"a":0,"e":"TOEIC類題｜not only A but also B は通常、近い主語 B に一致。manager → is。","type":"toeic","ja":"スタッフだけでなくマネージャーも出席する予定です。"}];
const core=Q.filter(x=>x.type==='core'), toeic=Q.filter(x=>x.type==='toeic');
const $=id=>document.getElementById(id);
CHAPTERS.forEach(([n,name,s,e])=>{let o=document.createElement('option');o.value=n;o.textContent=`Chapter ${n}｜${name}（Day ${s}${s===e?'':'–'+e}）`; $('chapter').appendChild(o);});
let hist=JSON.parse(localStorage.getItem('kikuCompleteHist')||'{"total":0,"correct":0,"wrong":[],"review":{}}');
hist.review ||= {};
const intervals=[10*60*1000,2*60*60*1000,2*24*60*60*1000,7*24*60*60*1000,21*24*60*60*1000];
function save(){localStorage.setItem('kikuCompleteHist',JSON.stringify(hist));stats();}
function dueIds(){let now=Date.now();return Object.entries(hist.review).filter(([id,v])=>v.due<=now).map(([id])=>Number(id));}
function stats(){$('stTotal').textContent=hist.total;$('stCorrect').textContent=hist.correct;$('stRate').textContent=(hist.total?Math.round(hist.correct/hist.total*100):0)+'%';$('stDue').textContent=dueIds().length;}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
let session=[],idx=0,answered=false,limit=null;
function poolFor(mode){
 if(mode==='all') return core;
 if(mode==='toeic') return toeic;
 if(mode==='wrong') return Q.filter(x=>hist.wrong.includes(x.id));
 if(mode==='due') {let ids=dueIds();return Q.filter(x=>ids.includes(x.id));}
 return core.filter(x=>x.ch===Number($('chapter').value));
}
function start(quick=false,forcedMode=null){
 let mode=forcedMode||$('mode').value, pool=poolFor(mode);
 if(!pool.length){alert(mode==='due'?'今すぐ復習する問題はありません。':'このモードで出題できる問題がありません。');return;}
 session=shuffle(pool); if(quick) session=session.slice(0,10); idx=0;$('quiz').classList.remove('hidden');show();$('quiz').scrollIntoView({behavior:'smooth',block:'start'});
}
function show(){
 answered=false;let x=session[idx],c=CHAPTERS.find(v=>v[0]===x.ch);
 $('bar').style.width=`${idx/session.length*100}%`;
 $('meta').innerHTML=`<span class="badge">${x.type==='toeic'?'TOEIC類題':'基本'}</span>${idx+1} / ${session.length}　Chapter ${x.ch} ${c[1]}　Day ${x.day}`;
 $('question').textContent=x.q;$('translation').innerHTML='';$('translation').classList.add('hidden');$('choices').innerHTML='';$('result').className='';$('result').innerHTML='';$('next').classList.add('hidden');
 x.c.forEach((t,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=`${String.fromCharCode(65+i)}. ${t}`;b.addEventListener('click',()=>answer(i,b));$('choices').appendChild(b);});
}

function optionReason(x,i){
 const opt=x.c[i], correct=x.c[x.a];
 if(i===x.a) return `○ 正解。「${opt}」がこの文の文法・語法に合います。${x.e}`;
 let reason=`× 「${opt}」はこの文では使えません。`;
 const o=opt.toLowerCase(), c=correct.toLowerCase(), q=x.q.toLowerCase();
 if(/\b(many|few|a few)\b/.test(o) && /(information|advice|time)/.test(q)) reason+=` 数えられない名詞には many / few / a few は使いません。`;
 else if(/\b(much|little|a little)\b/.test(o) && /(seats|employees|answers|restaurants|pens)/.test(q)) reason+=` 数えられる複数名詞には much / little / a little は使いません。`;
 else if(o.includes('to ') && /made us|make us|made her|make him/.test(q)) reason+=` make + 人 の後ろは通常「toなしの動詞原形」です。`;
 else if((o==='by'||o==='until') && (c==='by'||c==='until')) reason+= c==='by' ? ` 締切の「〜までに」は by。until は「〜までずっと」の継続です。` : ` 継続の「〜まで」は until。by は「〜までに」という締切です。`;
 else if((o==='during'||o==='while') && (c==='during'||c==='while')) reason+= c==='during' ? ` during の後ろは名詞。while の後ろは主語＋動詞の節が必要です。` : ` while の後ろは主語＋動詞の節。during の後ろは名詞です。`;
 else if(/despite|because of/.test(o) && /___ .*[,;]/.test(x.q)) reason+=` 後ろに主語＋動詞が続く場合は、前置詞ではなく接続詞が必要です。`;
 else if(/where is|do you know where is/.test(o)) reason+=` 間接疑問では疑問文の語順にせず「疑問詞＋主語＋動詞」にします。`;
 else if(o==='it' && c==='that') reason+=` 比較で同じ名詞の繰り返しを避ける代名詞には that を使います。`;
 else if(o==='another' && c==='others') reason+=` another は単数の「もう1つ／もう1人」。複数の「ほかの人々」は others です。`;
 else if(/to doing|to starting|to reading/.test(o)) reason+=` to の後ろの形がこの構文に合っていません。不定詞なら to + 動詞原形です。`;
 else if(/must submit/.test(o) && /documents|bridge|report/.test(q)) reason+=` 主語が「〜される側」なので受動態 be + 過去分詞が必要です。`;
 else if(/gets|will gets/.test(o) && /recommended that/.test(q)) reason+=` recommend that ... の提案・要求の用法では動詞原形を使います。`;
 else if(/are|were/.test(o) && /manager ___ attending/.test(q)) reason+=` not only A but also B は近い主語 B に一致します。manager は単数です。`;
 else reason+=` この問題で必要な形は「${correct}」です。${x.e}`;
 return reason;
}
function optionExplanationHTML(x){
 return `<div class="whybox"><div class="whytitle">選択肢ごとの解説</div>`+
 x.c.map((o,i)=>`<div class="whyitem"><strong>${String.fromCharCode(65+i)}.</strong> ${optionReason(x,i)}</div>`).join('')+
 `</div>`;
}

function answer(i,b){
 if(answered)return;answered=true;let x=session[idx],btns=[...document.querySelectorAll('#choices .choice')];$('translation').innerHTML=`<span class="label">日本語訳</span>${x.ja}`;$('translation').classList.remove('hidden');btns.forEach(z=>z.disabled=true);btns[x.a].classList.add('correct');
 hist.total++; let rv=hist.review[x.id]||{stage:0,due:0};
 if(i===x.a){
   hist.correct++;hist.wrong=hist.wrong.filter(id=>id!==x.id);
   rv.stage=Math.min(rv.stage+1,intervals.length-1);rv.due=Date.now()+intervals[rv.stage];
   $('result').className='result ok';$('result').innerHTML=`正解！<div class="ex">${x.e}</div>${optionExplanationHTML(x)}`;
 }else{
   b.classList.add('wrong');if(!hist.wrong.includes(x.id))hist.wrong.push(x.id);
   rv.stage=0;rv.due=Date.now()+intervals[0];
   $('result').className='result ng';$('result').innerHTML=`不正解。正解は ${String.fromCharCode(65+x.a)}。<div class="ex">${x.e}</div>${optionExplanationHTML(x)}<div class="ex due">約10分後に復習へ回します。</div>`;
 }
 hist.review[x.id]=rv;save();$('next').textContent=idx===session.length-1?'結果を見る':'次の問題';$('next').classList.remove('hidden');
}
function next(){
 if(idx<session.length-1){idx++;show();}else{$('bar').style.width='100%';$('meta').textContent=`${session.length}問 終了`;$('question').textContent='テスト完了！';$('choices').innerHTML='';$('result').className='result ok';$('result').innerHTML=`学習履歴を保存しました。復習時刻になった問題は「今日の復習」から出せます。`;$('next').classList.add('hidden');stats();}
}
$('start').addEventListener('click',()=>start(false));$('quick').addEventListener('click',()=>start(true));$('next').addEventListener('click',next);$('reviewNow').addEventListener('click',()=>start(false,'due'));
$('reset').addEventListener('click',()=>{if(confirm('回答履歴・復習予定をすべてリセットしますか？')){hist={total:0,correct:0,wrong:[],review:{}};save();}});
stats();
</script>

if ('serviceWorker' in navigator) {

}
