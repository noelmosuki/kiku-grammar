<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--accent:#2563eb;--ok:#15803d;--ng:#b91c1c;--line:#e5e7eb;--warn:#b45309}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
main{max-width:760px;margin:auto;padding:16px 14px 44px}h1{font-size:21px;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:480px){.grid{grid-template-columns:1fr}}
label{font-size:12px;color:var(--muted)}select,button{font:inherit}select{width:100%;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:12px;background:white}
.btn{border:0;border-radius:13px;padding:13px 16px;min-height:46px;font-weight:700;background:var(--accent);color:white}.btn.secondary{background:#eef2ff;color:#1e3a8a}.btn.danger{background:#fee2e2;color:#991b1b}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{text-align:center;background:#f9fafb;border-radius:12px;padding:10px 4px}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--muted)}
.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:var(--accent)}
.meta{font-size:12px;color:var(--muted);margin:12px 0 6px}.q{font-size:20px;line-height:1.55;font-weight:700;margin:8px 0 14px}
.choice{width:100%;text-align:left;background:white;border:1px solid var(--line);border-radius:14px;padding:14px;margin:7px 0;min-height:52px;font-size:16px}
.choice.correct{border-color:var(--ok);background:#ecfdf5}.choice.wrong{border-color:var(--ng);background:#fef2f2}.choice:disabled{color:var(--text);opacity:1}
.result{padding:12px;border-radius:12px;margin-top:12px;font-weight:700}.ok{background:#ecfdf5;color:#166534}.ng{background:#fef2f2;color:#991b1b}.ex{font-weight:400;color:var(--text);margin-top:6px;line-height:1.55}
.hidden{display:none}.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1;min-width:130px}
.badge{display:inline-block;font-size:11px;padding:4px 8px;border-radius:99px;background:#eef2ff;color:#3730a3;margin-right:5px}
.note{font-size:12px;color:var(--muted);line-height:1.6}.due{color:var(--warn);font-weight:700}

<script>
const CHAPTERS=[[1, "動詞", 1, 2], [2, "時制", 3, 7], [3, "助動詞", 8, 10], [4, "名詞と冠詞", 11, 11], [5, "形容詞", 12, 15], [6, "代名詞", 16, 19], [7, "副詞", 20, 22], [8, "不定詞", 23, 26], [9, "動名詞", 27, 28], [10, "分詞", 29, 30], [11, "受動態", 31, 32], [12, "疑問詞", 33, 33], [13, "比較", 34, 35], [14, "接続詞", 36, 41], [15, "仮定法", 42, 43], [16, "関係詞", 44, 46], [17, "前置詞", 47, 48], [18, "一致と倒置", 49, 49]];
const Q=[{"day": 1, "ch": 1, "q": "She ___ very happy after hearing the news.", "c": ["looked", "looked at", "watched", "saw"], "a": 0, "e": "look は「〜に見える」の意味では linking verb（補語を取る動詞）として使えます。", "id": 1, "type": "core"}, {"day": 1, "ch": 1, "q": "The manager ___ the proposal carefully before approving it.", "c": ["examined", "examined about", "discussed about", "explained about"], "a": 0, "e": "examine は他動詞なので、目的語の前に about は不要です。", "id": 2, "type": "core"}, {"day": 2, "ch": 1, "q": "The manager ___ the proposal carefully before the meeting.", "c": ["discussed", "discussed about", "explained about", "suggested to"], "a": 0, "e": "discuss は他動詞なので about は不要です。", "id": 3, "type": "core"}, {"day": 2, "ch": 1, "q": "Please ___ the lights before you leave.", "c": ["turn off", "turn them off", "turn off them", "both A and B"], "a": 3, "e": "turn off は句動詞。名詞なら turn off the lights、代名詞なら turn them off。", "id": 4, "type": "core"}, {"day": 3, "ch": 2, "q": "I ___ this laptop for three years.", "c": ["have had", "had", "am having", "have"], "a": 0, "e": "「3年間ずっと所有している」ので現在完了。", "id": 5, "type": "core"}, {"day": 3, "ch": 2, "q": "The museum ___ at 10 a.m. tomorrow.", "c": ["opens", "will opening", "is openning", "opened"], "a": 0, "e": "時刻表・予定として確定した未来は現在形で表せます。", "id": 6, "type": "core"}, {"day": 4, "ch": 2, "q": "By the time we arrived, the movie ___.", "c": ["had started", "has started", "starts", "was start"], "a": 0, "e": "過去のある時点より前に起きたことなので過去完了。", "id": 7, "type": "core"}, {"day": 4, "ch": 2, "q": "I ___ dinner when the phone rang.", "c": ["was cooking", "cooked now", "have cooked", "am cooking"], "a": 0, "e": "過去のある時点で進行中だった動作は過去進行形。", "id": 8, "type": "core"}, {"day": 5, "ch": 2, "q": "Look at those clouds. It ___ soon.", "c": ["is going to rain", "rains", "has rained", "rain"], "a": 0, "e": "目の前の根拠から予測するので be going to が自然です。", "id": 9, "type": "core"}, {"day": 5, "ch": 2, "q": "By next March, she ___ here for ten years.", "c": ["will have worked", "works", "has worked yesterday", "will worked"], "a": 0, "e": "未来のある時点までの継続は未来完了。", "id": 10, "type": "core"}, {"day": 6, "ch": 2, "q": "She usually ___ to work by train.", "c": ["goes", "is going", "has gone", "go"], "a": 0, "e": "習慣なので現在形。主語が三人称単数なので goes。", "id": 11, "type": "core"}, {"day": 6, "ch": 2, "q": "I ___ him since we graduated from college.", "c": ["haven't seen", "didn't see", "don't see yesterday", "wasn't seeing"], "a": 0, "e": "since + 過去の起点には現在完了が自然です。", "id": 12, "type": "core"}, {"day": 7, "ch": 2, "q": "This time tomorrow, I ___ on the plane.", "c": ["will be sitting", "sit", "have sat", "am sat"], "a": 0, "e": "未来のある時点で進行中の動作なので未来進行形。", "id": 13, "type": "core"}, {"day": 7, "ch": 2, "q": "She was tired because she ___ all day.", "c": ["had been working", "has worked tomorrow", "was work", "would work"], "a": 0, "e": "過去の時点まで続いていた動作は過去完了進行形。", "id": 14, "type": "core"}, {"day": 8, "ch": 3, "q": "You ___ smoke here. It is prohibited.", "c": ["must not", "do not have to", "may", "should"], "a": 0, "e": "must not は「〜してはいけない」。", "id": 15, "type": "core"}, {"day": 8, "ch": 3, "q": "___ I borrow your charger for a moment?", "c": ["May", "Must", "Should have", "Used to"], "a": 0, "e": "許可を求める丁寧な表現として May I ...? が使えます。", "id": 16, "type": "core"}, {"day": 9, "ch": 3, "q": "He ___ be at home; the lights are on.", "c": ["must", "cannot", "would rather", "used to"], "a": 0, "e": "強い推量「〜に違いない」は must。", "id": 17, "type": "core"}, {"day": 9, "ch": 3, "q": "Employees ___ wear their ID badges at all times.", "c": ["must", "might", "used to", "would rather"], "a": 0, "e": "規則上の義務は must が自然です。", "id": 18, "type": "core"}, {"day": 10, "ch": 3, "q": "You ___ bring any food; everything is provided.", "c": ["do not have to", "must not", "cannot", "ought not"], "a": 0, "e": "「持ってくる必要はない」なので do not have to。", "id": 19, "type": "core"}, {"day": 10, "ch": 3, "q": "I ___ play tennis every weekend when I was a student.", "c": ["used to", "must", "may", "have to"], "a": 0, "e": "過去の習慣は used to + 動詞原形。", "id": 20, "type": "core"}, {"day": 11, "ch": 4, "q": "She gave me ___ useful advice.", "c": ["some", "an", "a", "many"], "a": 0, "e": "advice は不可算名詞なので a/an は付けません。", "id": 21, "type": "core"}, {"day": 11, "ch": 4, "q": "We need ___ information before making a decision.", "c": ["more", "many", "an", "a few"], "a": 0, "e": "information は不可算名詞なので many/an/a few は使えません。", "id": 22, "type": "core"}, {"day": 12, "ch": 5, "q": "This is a ___ difficult problem.", "c": ["rather", "much", "very much", "more very"], "a": 0, "e": "形容詞 difficult を修飾する副詞 rather が使えます。", "id": 23, "type": "core"}, {"day": 12, "ch": 5, "q": "There aren't ___ seats left.", "c": ["many", "much", "a little", "an"], "a": 0, "e": "seats は可算名詞複数なので many。", "id": 24, "type": "core"}, {"day": 13, "ch": 5, "q": "The instructions were not clear ___.", "c": ["enough", "too", "so", "such"], "a": 0, "e": "形容詞 + enough の語順です。", "id": 25, "type": "core"}, {"day": 13, "ch": 5, "q": "We have ___ time, so let's review the report once more.", "c": ["a little", "little", "a few", "few"], "a": 0, "e": "a little は「少しはある」。time は不可算名詞です。", "id": 26, "type": "core"}, {"day": 14, "ch": 5, "q": "He is ___ to lift the box alone.", "c": ["strong enough", "enough strong", "so strong enough", "too enough strong"], "a": 0, "e": "形容詞 + enough + to不定詞。", "id": 27, "type": "core"}, {"day": 14, "ch": 5, "q": "___ employee must complete the training.", "c": ["Every", "All", "Both of", "Many a of"], "a": 0, "e": "every + 単数名詞で「すべての〜」。", "id": 28, "type": "core"}, {"day": 15, "ch": 5, "q": "This book is worth ___.", "c": ["reading", "to read", "read", "to be read"], "a": 0, "e": "be worth + 動名詞。", "id": 29, "type": "core"}, {"day": 15, "ch": 5, "q": "You can choose ___ option; both are acceptable.", "c": ["either", "neither", "every", "no"], "a": 0, "e": "2つのうちどちらでもよい、は either。", "id": 30, "type": "core"}, {"day": 16, "ch": 6, "q": "___ of the two answers is correct.", "c": ["Neither", "None", "No one", "Nothing"], "a": 0, "e": "2つのうちどちらも〜ない、は neither。", "id": 31, "type": "core"}, {"day": 16, "ch": 6, "q": "The weather in Osaka is warmer than ___ in Sapporo.", "c": ["that", "it one", "those one", "this"], "a": 0, "e": "同じ種類の名詞 weather の繰り返しを避けるため that を使います。", "id": 32, "type": "core"}, {"day": 17, "ch": 6, "q": "The two sisters help ___.", "c": ["each other", "themselves each", "one", "another one"], "a": 0, "e": "2人がお互いに、は each other。", "id": 33, "type": "core"}, {"day": 17, "ch": 6, "q": "___ is important to back up your files regularly.", "c": ["It", "One", "That one", "Those"], "a": 0, "e": "形式主語 It を使い、真の主語は to back up ...。", "id": 34, "type": "core"}, {"day": 18, "ch": 6, "q": "I have two pens. You may use ___.", "c": ["either", "both one", "any one", "neither one"], "a": 0, "e": "2つのうちどちらでも、は either。", "id": 35, "type": "core"}, {"day": 18, "ch": 6, "q": "The population of this city is larger than ___ of that city.", "c": ["that", "it", "one", "those"], "a": 0, "e": "population の繰り返しを避ける代名詞は that。", "id": 36, "type": "core"}, {"day": 19, "ch": 6, "q": "Everyone should bring ___ own ID.", "c": ["their", "its", "his only", "our"], "a": 0, "e": "単数扱いの everyone を受ける代名詞として singular they が自然です。", "id": 37, "type": "core"}, {"day": 19, "ch": 6, "q": "Some people prefer tea; ___ prefer coffee.", "c": ["others", "another", "the other one people", "other"], "a": 0, "e": "不特定多数の「ほかの人々」は others。", "id": 38, "type": "core"}, {"day": 20, "ch": 7, "q": "He speaks English very ___.", "c": ["fluently", "fluent", "fluency", "more fluent"], "a": 0, "e": "動詞 speaks を修飾するので副詞 fluently。", "id": 39, "type": "core"}, {"day": 20, "ch": 7, "q": "I met her two years ___.", "c": ["ago", "before from now", "yet", "still"], "a": 0, "e": "現在から見て「〜前」は ago。", "id": 40, "type": "core"}, {"day": 21, "ch": 7, "q": "I have ___ finished my homework.", "c": ["already", "yet", "still not to", "ever not"], "a": 0, "e": "肯定文の「もう」は already が自然です。", "id": 41, "type": "core"}, {"day": 21, "ch": 7, "q": "The box is ___ heavy for one person to carry.", "c": ["too", "so much", "almost of", "enough"], "a": 0, "e": "too + 形容詞 + to do で「〜するには…すぎる」。", "id": 42, "type": "core"}, {"day": 22, "ch": 7, "q": "She is ___ late for meetings.", "c": ["hardly ever", "hard ever", "almost ever", "scarce ever"], "a": 0, "e": "hardly ever = めったに〜ない。", "id": 43, "type": "core"}, {"day": 22, "ch": 7, "q": "He hardly ___ complains about his workload.", "c": ["ever", "never not", "almost", "either"], "a": 0, "e": "hardly ever = めったに〜ない。", "id": 44, "type": "core"}, {"day": 23, "ch": 8, "q": "I decided ___ abroad next year.", "c": ["to study", "studying", "study", "to studying"], "a": 0, "e": "decide は to不定詞を取ります。", "id": 45, "type": "core"}, {"day": 23, "ch": 8, "q": "Her goal is ___ a small business.", "c": ["to start", "start", "started", "to starting"], "a": 0, "e": "be動詞の補語として to不定詞の名詞的用法が使えます。", "id": 46, "type": "core"}, {"day": 24, "ch": 8, "q": "This box is too heavy for me ___.", "c": ["to carry", "carrying", "carry", "to carrying"], "a": 0, "e": "too ... to 〜「〜するには…すぎる」。", "id": 47, "type": "core"}, {"day": 24, "ch": 8, "q": "I was surprised ___ the news.", "c": ["to hear", "hearing to", "hear", "for heard"], "a": 0, "e": "感情を表す形容詞の原因を to不定詞で表せます。", "id": 48, "type": "core"}, {"day": 25, "ch": 8, "q": "He seems ___ the answer.", "c": ["to know", "knowing", "know", "to knowing"], "a": 0, "e": "seem + to不定詞。", "id": 49, "type": "core"}, {"day": 25, "ch": 8, "q": "Could you tell me ___ to use this machine?", "c": ["how", "what is", "that how", "which is how"], "a": 0, "e": "how to do =「どのように〜するか」。", "id": 50, "type": "core"}, {"day": 26, "ch": 8, "q": "I went to the station ___ my friend.", "c": ["to meet", "meeting", "met", "for meet"], "a": 0, "e": "目的を表す to不定詞。", "id": 51, "type": "core"}, {"day": 26, "ch": 8, "q": "The teacher made us ___ the exercise again.", "c": ["do", "to do", "doing", "done"], "a": 0, "e": "make + O + 動詞原形。", "id": 52, "type": "core"}, {"day": 27, "ch": 9, "q": "Would you mind ___ the window?", "c": ["opening", "to open", "open", "opened"], "a": 0, "e": "mind + 動名詞。", "id": 53, "type": "core"}, {"day": 27, "ch": 9, "q": "I appreciate ___ invited to the meeting.", "c": ["being", "to be", "be", "been"], "a": 0, "e": "appreciate の後ろは動名詞。受動なので being invited。", "id": 54, "type": "core"}, {"day": 28, "ch": 9, "q": "He avoided ___ about the issue.", "c": ["talking", "to talk", "talk", "to talking"], "a": 0, "e": "avoid + 動名詞。", "id": 55, "type": "core"}, {"day": 28, "ch": 9, "q": "Remember ___ the door when you leave.", "c": ["to lock", "locking yesterday", "lock to", "locked"], "a": 0, "e": "remember to do は「これから〜するのを忘れない」。", "id": 56, "type": "core"}, {"day": 29, "ch": 10, "q": "The news was very ___.", "c": ["surprising", "surprised", "surprise", "to surprise"], "a": 0, "e": "物事が人を驚かせる性質なので -ing。", "id": 57, "type": "core"}, {"day": 29, "ch": 10, "q": "The man ___ by the window is our new director.", "c": ["standing", "stood by someone", "stand", "to stood"], "a": 0, "e": "能動の意味で名詞を修飾するので現在分詞 standing。", "id": 58, "type": "core"}, {"day": 30, "ch": 10, "q": "___ in 1920, the building is still in use.", "c": ["Built", "Building", "Build", "Having build"], "a": 0, "e": "建物は「建てられた」ので過去分詞 Built。", "id": 59, "type": "core"}, {"day": 30, "ch": 10, "q": "___ the email, she called the client immediately.", "c": ["Having read", "Read", "To reading", "Having reading"], "a": 0, "e": "先に完了した動作を強調する分詞構文は Having + 過去分詞。", "id": 60, "type": "core"}, {"day": 31, "ch": 11, "q": "The new bridge ___ next year.", "c": ["will be completed", "will complete", "completes", "has completing"], "a": 0, "e": "橋は完成「される」ので受動態。", "id": 61, "type": "core"}, {"day": 31, "ch": 11, "q": "The documents ___ before the meeting starts.", "c": ["must be submitted", "must submit", "must be submit", "are must submitted"], "a": 0, "e": "documents は提出される側なので助動詞 + be + 過去分詞。", "id": 62, "type": "core"}, {"day": 32, "ch": 11, "q": "She was made ___ the report again.", "c": ["to write", "write", "writing", "written"], "a": 0, "e": "make O do の受動態は be made to do。", "id": 63, "type": "core"}, {"day": 32, "ch": 11, "q": "He is known ___ his careful work.", "c": ["for", "by of", "to as", "with"], "a": 0, "e": "be known for =「〜で知られている」。", "id": 64, "type": "core"}, {"day": 33, "ch": 12, "q": "Do you know ___ he left early?", "c": ["why", "what", "which", "whose"], "a": 0, "e": "理由を尋ねる間接疑問なので why。", "id": 65, "type": "core"}, {"day": 33, "ch": 12, "q": "Can you tell me ___ the nearest station is?", "c": ["where", "where is", "what place is", "that where"], "a": 0, "e": "間接疑問では疑問詞 + 主語 + 動詞の語順。", "id": 66, "type": "core"}, {"day": 34, "ch": 13, "q": "This car is ___ than that one.", "c": ["more expensive", "expensiver", "most expensive", "more expensiver"], "a": 0, "e": "長い形容詞の比較級は more + 形容詞。", "id": 67, "type": "core"}, {"day": 34, "ch": 13, "q": "This year's sales are ___ higher than last year's.", "c": ["much", "very", "more very", "many"], "a": 0, "e": "比較級 higher の強調には much を使えます。", "id": 68, "type": "core"}, {"day": 35, "ch": 13, "q": "No other student in the class is ___ Ken.", "c": ["as tall as", "taller as", "so taller than", "the tallest than"], "a": 0, "e": "原級比較 as ... as。", "id": 69, "type": "core"}, {"day": 35, "ch": 13, "q": "This is one of ___ restaurants in the area.", "c": ["the best", "best", "better", "the better than"], "a": 0, "e": "one of the + 最上級 + 複数名詞。", "id": 70, "type": "core"}, {"day": 36, "ch": 14, "q": "I stayed home ___ it was raining heavily.", "c": ["because", "despite", "during", "because of"], "a": 0, "e": "後ろが文なので because。", "id": 71, "type": "core"}, {"day": 36, "ch": 14, "q": "The office was small, ___ it was comfortable.", "c": ["but", "because of", "despite", "during"], "a": 0, "e": "2つの節を対比で結ぶ等位接続詞 but。", "id": 72, "type": "core"}, {"day": 37, "ch": 14, "q": "___ being tired, she kept working.", "c": ["Despite", "Although", "Because", "While of"], "a": 0, "e": "後ろが名詞/動名詞なので despite。", "id": 73, "type": "core"}, {"day": 37, "ch": 14, "q": "I don't know ___ he will attend the meeting.", "c": ["whether", "despite", "during", "because of"], "a": 0, "e": "「〜かどうか」の名詞節は whether/if。", "id": 74, "type": "core"}, {"day": 38, "ch": 14, "q": "Call me ___ you arrive.", "c": ["when", "during", "because of", "despite"], "a": 0, "e": "後ろに文を取る接続詞 when。", "id": 75, "type": "core"}, {"day": 38, "ch": 14, "q": "Please stay here ___ I return.", "c": ["until", "by", "during", "for"], "a": 0, "e": "「私が戻るまでずっと」は until + 節。", "id": 76, "type": "core"}, {"day": 39, "ch": 14, "q": "I will wait here ___ you come back.", "c": ["until", "by", "during", "within"], "a": 0, "e": "「〜するまでずっと」は until。", "id": 77, "type": "core"}, {"day": 39, "ch": 14, "q": "We left early ___ we could avoid the traffic.", "c": ["so that", "because of", "despite", "such that of"], "a": 0, "e": "目的「〜するために」は so that + 主語 + 動詞。", "id": 78, "type": "core"}, {"day": 40, "ch": 14, "q": "Take an umbrella ___ it rains.", "c": ["in case", "unless", "despite", "during"], "a": 0, "e": "in case = 〜するといけないので／〜の場合に備えて。", "id": 79, "type": "core"}, {"day": 40, "ch": 14, "q": "The presentation was ___ interesting that everyone stayed until the end.", "c": ["so", "such an", "too much", "enough"], "a": 0, "e": "so + 形容詞 + that ... の結果構文。", "id": 80, "type": "core"}, {"day": 41, "ch": 14, "q": "You cannot enter ___ you have a ticket.", "c": ["unless", "if", "because", "although"], "a": 0, "e": "unless = 〜でない限り。", "id": 81, "type": "core"}, {"day": 41, "ch": 14, "q": "___ he was busy, he answered all my questions.", "c": ["Although", "Despite", "Because of", "During"], "a": 0, "e": "後ろが節なので although。", "id": 82, "type": "core"}, {"day": 42, "ch": 15, "q": "If I ___ more time, I would travel more.", "c": ["had", "have", "will have", "would have"], "a": 0, "e": "現在の事実に反する仮定なので if + 過去形。", "id": 83, "type": "core"}, {"day": 42, "ch": 15, "q": "The doctor recommended that he ___ more rest.", "c": ["get", "gets", "gotten", "will gets"], "a": 0, "e": "提案・要求などに続く that節では動詞原形を使うことがあります。", "id": 84, "type": "core"}, {"day": 43, "ch": 15, "q": "If she had left earlier, she ___ the train.", "c": ["would have caught", "will catch", "would catch", "caught"], "a": 0, "e": "過去の事実に反する仮定法過去完了。", "id": 85, "type": "core"}, {"day": 43, "ch": 15, "q": "Without your help, I ___ the project on time.", "c": ["couldn't have finished", "can't finished", "will not finish yesterday", "hadn't finish"], "a": 0, "e": "過去の反実仮想を without で表す形。", "id": 86, "type": "core"}, {"day": 44, "ch": 16, "q": "The woman ___ lives next door is a doctor.", "c": ["who", "which", "whose", "whom is"], "a": 0, "e": "先行詞が人で、関係詞が主語なので who。", "id": 87, "type": "core"}, {"day": 44, "ch": 16, "q": "The person ___ I spoke to was very helpful.", "c": ["whom", "which", "what", "whose is"], "a": 0, "e": "先行詞が人で目的格なので whom（会話では who も可）。", "id": 88, "type": "core"}, {"day": 45, "ch": 16, "q": "This is the book ___ I told you about.", "c": ["that", "what", "who", "whose it"], "a": 0, "e": "先行詞 book を受ける目的格の関係詞。that/which が可。", "id": 89, "type": "core"}, {"day": 45, "ch": 16, "q": "This is exactly ___ I needed.", "c": ["what", "that what", "which what", "who"], "a": 0, "e": "what =「〜するもの／こと」で先行詞を含みます。", "id": 90, "type": "core"}, {"day": 46, "ch": 16, "q": "The company, ___ was founded in 1990, now has 500 employees.", "c": ["which", "that", "what", "where"], "a": 0, "e": "非制限用法では that は使わず which。", "id": 91, "type": "core"}, {"day": 46, "ch": 16, "q": "___ wants to join the tour must register today.", "c": ["Whoever", "Whatever person which", "Whichever is person", "No matter what person is"], "a": 0, "e": "Whoever =「〜する人は誰でも」。", "id": 92, "type": "core"}, {"day": 47, "ch": 17, "q": "She is good ___ solving problems.", "c": ["at", "in", "on", "for"], "a": 0, "e": "be good at 〜ing。", "id": 93, "type": "core"}, {"day": 47, "ch": 17, "q": "The report must be finished ___ Friday.", "c": ["by", "until during", "for", "since"], "a": 0, "e": "締切「金曜までに」は by。", "id": 94, "type": "core"}, {"day": 48, "ch": 17, "q": "We arrived ___ the airport at noon.", "c": ["at", "to", "in", "on"], "a": 0, "e": "arrive at + 比較的小さい場所。", "id": 95, "type": "core"}, {"day": 48, "ch": 17, "q": "We discussed the issue ___ the meeting.", "c": ["during", "for", "by", "until"], "a": 0, "e": "「会議の間に」は during + 名詞。", "id": 96, "type": "core"}, {"day": 49, "ch": 18, "q": "Neither the manager nor the employees ___ satisfied.", "c": ["are", "is", "be", "was being"], "a": 0, "e": "neither A nor B は通常、近い主語 B に動詞を一致させます。employees → are。", "id": 97, "type": "core"}, {"day": 49, "ch": 18, "q": "Not only the staff but also the manager ___ attending.", "c": ["is", "are", "be", "were all"], "a": 0, "e": "not only A but also B は通常、近い主語 B に一致。manager → is。", "id": 98, "type": "core"}, {"id": 99, "day": 1, "ch": 1, "q": "The manager ___ the proposal carefully before approving it.", "c": ["examined", "examined about", "discussed about", "explained about"], "a": 0, "e": "TOEIC類題｜examine は他動詞なので、目的語の前に about は不要です。", "type": "toeic"}, {"id": 100, "day": 2, "ch": 1, "q": "Please ___ the lights before you leave.", "c": ["turn off", "turn them off", "turn off them", "both A and B"], "a": 3, "e": "TOEIC類題｜turn off は句動詞。名詞なら turn off the lights、代名詞なら turn them off。", "type": "toeic"}, {"id": 101, "day": 3, "ch": 2, "q": "The museum ___ at 10 a.m. tomorrow.", "c": ["opens", "will opening", "is openning", "opened"], "a": 0, "e": "TOEIC類題｜時刻表・予定として確定した未来は現在形で表せます。", "type": "toeic"}, {"id": 102, "day": 4, "ch": 2, "q": "I ___ dinner when the phone rang.", "c": ["was cooking", "cooked now", "have cooked", "am cooking"], "a": 0, "e": "TOEIC類題｜過去のある時点で進行中だった動作は過去進行形。", "type": "toeic"}, {"id": 103, "day": 5, "ch": 2, "q": "By next March, she ___ here for ten years.", "c": ["will have worked", "works", "has worked yesterday", "will worked"], "a": 0, "e": "TOEIC類題｜未来のある時点までの継続は未来完了。", "type": "toeic"}, {"id": 104, "day": 6, "ch": 2, "q": "I ___ him since we graduated from college.", "c": ["haven't seen", "didn't see", "don't see yesterday", "wasn't seeing"], "a": 0, "e": "TOEIC類題｜since + 過去の起点には現在完了が自然です。", "type": "toeic"}, {"id": 105, "day": 7, "ch": 2, "q": "She was tired because she ___ all day.", "c": ["had been working", "has worked tomorrow", "was work", "would work"], "a": 0, "e": "TOEIC類題｜過去の時点まで続いていた動作は過去完了進行形。", "type": "toeic"}, {"id": 106, "day": 8, "ch": 3, "q": "___ I borrow your charger for a moment?", "c": ["May", "Must", "Should have", "Used to"], "a": 0, "e": "TOEIC類題｜許可を求める丁寧な表現として May I ...? が使えます。", "type": "toeic"}, {"id": 107, "day": 9, "ch": 3, "q": "Employees ___ wear their ID badges at all times.", "c": ["must", "might", "used to", "would rather"], "a": 0, "e": "TOEIC類題｜規則上の義務は must が自然です。", "type": "toeic"}, {"id": 108, "day": 10, "ch": 3, "q": "I ___ play tennis every weekend when I was a student.", "c": ["used to", "must", "may", "have to"], "a": 0, "e": "TOEIC類題｜過去の習慣は used to + 動詞原形。", "type": "toeic"}, {"id": 109, "day": 11, "ch": 4, "q": "We need ___ information before making a decision.", "c": ["more", "many", "an", "a few"], "a": 0, "e": "TOEIC類題｜information は不可算名詞なので many/an/a few は使えません。", "type": "toeic"}, {"id": 110, "day": 12, "ch": 5, "q": "There aren't ___ seats left.", "c": ["many", "much", "a little", "an"], "a": 0, "e": "TOEIC類題｜seats は可算名詞複数なので many。", "type": "toeic"}, {"id": 111, "day": 13, "ch": 5, "q": "We have ___ time, so let's review the report once more.", "c": ["a little", "little", "a few", "few"], "a": 0, "e": "TOEIC類題｜a little は「少しはある」。time は不可算名詞です。", "type": "toeic"}, {"id": 112, "day": 14, "ch": 5, "q": "___ employee must complete the training.", "c": ["Every", "All", "Both of", "Many a of"], "a": 0, "e": "TOEIC類題｜every + 単数名詞で「すべての〜」。", "type": "toeic"}, {"id": 113, "day": 15, "ch": 5, "q": "You can choose ___ option; both are acceptable.", "c": ["either", "neither", "every", "no"], "a": 0, "e": "TOEIC類題｜2つのうちどちらでもよい、は either。", "type": "toeic"}, {"id": 114, "day": 16, "ch": 6, "q": "The weather in Osaka is warmer than ___ in Sapporo.", "c": ["that", "it one", "those one", "this"], "a": 0, "e": "TOEIC類題｜同じ種類の名詞 weather の繰り返しを避けるため that を使います。", "type": "toeic"}, {"id": 115, "day": 17, "ch": 6, "q": "___ is important to back up your files regularly.", "c": ["It", "One", "That one", "Those"], "a": 0, "e": "TOEIC類題｜形式主語 It を使い、真の主語は to back up ...。", "type": "toeic"}, {"id": 116, "day": 18, "ch": 6, "q": "The population of this city is larger than ___ of that city.", "c": ["that", "it", "one", "those"], "a": 0, "e": "TOEIC類題｜population の繰り返しを避ける代名詞は that。", "type": "toeic"}, {"id": 117, "day": 19, "ch": 6, "q": "Some people prefer tea; ___ prefer coffee.", "c": ["others", "another", "the other one people", "other"], "a": 0, "e": "TOEIC類題｜不特定多数の「ほかの人々」は others。", "type": "toeic"}, {"id": 118, "day": 20, "ch": 7, "q": "I met her two years ___.", "c": ["ago", "before from now", "yet", "still"], "a": 0, "e": "TOEIC類題｜現在から見て「〜前」は ago。", "type": "toeic"}, {"id": 119, "day": 21, "ch": 7, "q": "The box is ___ heavy for one person to carry.", "c": ["too", "so much", "almost of", "enough"], "a": 0, "e": "TOEIC類題｜too + 形容詞 + to do で「〜するには…すぎる」。", "type": "toeic"}, {"id": 120, "day": 22, "ch": 7, "q": "He hardly ___ complains about his workload.", "c": ["ever", "never not", "almost", "either"], "a": 0, "e": "TOEIC類題｜hardly ever = めったに〜ない。", "type": "toeic"}, {"id": 121, "day": 23, "ch": 8, "q": "Her goal is ___ a small business.", "c": ["to start", "start", "started", "to starting"], "a": 0, "e": "TOEIC類題｜be動詞の補語として to不定詞の名詞的用法が使えます。", "type": "toeic"}, {"id": 122, "day": 24, "ch": 8, "q": "I was surprised ___ the news.", "c": ["to hear", "hearing to", "hear", "for heard"], "a": 0, "e": "TOEIC類題｜感情を表す形容詞の原因を to不定詞で表せます。", "type": "toeic"}, {"id": 123, "day": 25, "ch": 8, "q": "Could you tell me ___ to use this machine?", "c": ["how", "what is", "that how", "which is how"], "a": 0, "e": "TOEIC類題｜how to do =「どのように〜するか」。", "type": "toeic"}, {"id": 124, "day": 26, "ch": 8, "q": "The teacher made us ___ the exercise again.", "c": ["do", "to do", "doing", "done"], "a": 0, "e": "TOEIC類題｜make + O + 動詞原形。", "type": "toeic"}, {"id": 125, "day": 27, "ch": 9, "q": "I appreciate ___ invited to the meeting.", "c": ["being", "to be", "be", "been"], "a": 0, "e": "TOEIC類題｜appreciate の後ろは動名詞。受動なので being invited。", "type": "toeic"}, {"id": 126, "day": 28, "ch": 9, "q": "Remember ___ the door when you leave.", "c": ["to lock", "locking yesterday", "lock to", "locked"], "a": 0, "e": "TOEIC類題｜remember to do は「これから〜するのを忘れない」。", "type": "toeic"}, {"id": 127, "day": 29, "ch": 10, "q": "The man ___ by the window is our new director.", "c": ["standing", "stood by someone", "stand", "to stood"], "a": 0, "e": "TOEIC類題｜能動の意味で名詞を修飾するので現在分詞 standing。", "type": "toeic"}, {"id": 128, "day": 30, "ch": 10, "q": "___ the email, she called the client immediately.", "c": ["Having read", "Read", "To reading", "Having reading"], "a": 0, "e": "TOEIC類題｜先に完了した動作を強調する分詞構文は Having + 過去分詞。", "type": "toeic"}, {"id": 129, "day": 31, "ch": 11, "q": "The documents ___ before the meeting starts.", "c": ["must be submitted", "must submit", "must be submit", "are must submitted"], "a": 0, "e": "TOEIC類題｜documents は提出される側なので助動詞 + be + 過去分詞。", "type": "toeic"}, {"id": 130, "day": 32, "ch": 11, "q": "He is known ___ his careful work.", "c": ["for", "by of", "to as", "with"], "a": 0, "e": "TOEIC類題｜be known for =「〜で知られている」。", "type": "toeic"}, {"id": 131, "day": 33, "ch": 12, "q": "Can you tell me ___ the nearest station is?", "c": ["where", "where is", "what place is", "that where"], "a": 0, "e": "TOEIC類題｜間接疑問では疑問詞 + 主語 + 動詞の語順。", "type": "toeic"}, {"id": 132, "day": 34, "ch": 13, "q": "This year's sales are ___ higher than last year's.", "c": ["much", "very", "more very", "many"], "a": 0, "e": "TOEIC類題｜比較級 higher の強調には much を使えます。", "type": "toeic"}, {"id": 133, "day": 35, "ch": 13, "q": "This is one of ___ restaurants in the area.", "c": ["the best", "best", "better", "the better than"], "a": 0, "e": "TOEIC類題｜one of the + 最上級 + 複数名詞。", "type": "toeic"}, {"id": 134, "day": 36, "ch": 14, "q": "The office was small, ___ it was comfortable.", "c": ["but", "because of", "despite", "during"], "a": 0, "e": "TOEIC類題｜2つの節を対比で結ぶ等位接続詞 but。", "type": "toeic"}, {"id": 135, "day": 37, "ch": 14, "q": "I don't know ___ he will attend the meeting.", "c": ["whether", "despite", "during", "because of"], "a": 0, "e": "TOEIC類題｜「〜かどうか」の名詞節は whether/if。", "type": "toeic"}, {"id": 136, "day": 38, "ch": 14, "q": "Please stay here ___ I return.", "c": ["until", "by", "during", "for"], "a": 0, "e": "TOEIC類題｜「私が戻るまでずっと」は until + 節。", "type": "toeic"}, {"id": 137, "day": 39, "ch": 14, "q": "We left early ___ we could avoid the traffic.", "c": ["so that", "because of", "despite", "such that of"], "a": 0, "e": "TOEIC類題｜目的「〜するために」は so that + 主語 + 動詞。", "type": "toeic"}, {"id": 138, "day": 40, "ch": 14, "q": "The presentation was ___ interesting that everyone stayed until the end.", "c": ["so", "such an", "too much", "enough"], "a": 0, "e": "TOEIC類題｜so + 形容詞 + that ... の結果構文。", "type": "toeic"}, {"id": 139, "day": 41, "ch": 14, "q": "___ he was busy, he answered all my questions.", "c": ["Although", "Despite", "Because of", "During"], "a": 0, "e": "TOEIC類題｜後ろが節なので although。", "type": "toeic"}, {"id": 140, "day": 42, "ch": 15, "q": "The doctor recommended that he ___ more rest.", "c": ["get", "gets", "gotten", "will gets"], "a": 0, "e": "TOEIC類題｜提案・要求などに続く that節では動詞原形を使うことがあります。", "type": "toeic"}, {"id": 141, "day": 43, "ch": 15, "q": "Without your help, I ___ the project on time.", "c": ["couldn't have finished", "can't finished", "will not finish yesterday", "hadn't finish"], "a": 0, "e": "TOEIC類題｜過去の反実仮想を without で表す形。", "type": "toeic"}, {"id": 142, "day": 44, "ch": 16, "q": "The person ___ I spoke to was very helpful.", "c": ["whom", "which", "what", "whose is"], "a": 0, "e": "TOEIC類題｜先行詞が人で目的格なので whom（会話では who も可）。", "type": "toeic"}, {"id": 143, "day": 45, "ch": 16, "q": "This is exactly ___ I needed.", "c": ["what", "that what", "which what", "who"], "a": 0, "e": "TOEIC類題｜what =「〜するもの／こと」で先行詞を含みます。", "type": "toeic"}, {"id": 144, "day": 46, "ch": 16, "q": "___ wants to join the tour must register today.", "c": ["Whoever", "Whatever person which", "Whichever is person", "No matter what person is"], "a": 0, "e": "TOEIC類題｜Whoever =「〜する人は誰でも」。", "type": "toeic"}, {"id": 145, "day": 47, "ch": 17, "q": "The report must be finished ___ Friday.", "c": ["by", "until during", "for", "since"], "a": 0, "e": "TOEIC類題｜締切「金曜までに」は by。", "type": "toeic"}, {"id": 146, "day": 48, "ch": 17, "q": "We discussed the issue ___ the meeting.", "c": ["during", "for", "by", "until"], "a": 0, "e": "TOEIC類題｜「会議の間に」は during + 名詞。", "type": "toeic"}, {"id": 147, "day": 49, "ch": 18, "q": "Not only the staff but also the manager ___ attending.", "c": ["is", "are", "be", "were all"], "a": 0, "e": "TOEIC類題｜not only A but also B は通常、近い主語 B に一致。manager → is。", "type": "toeic"}];
const core=Q.filter(x=>x.type==='core'), toeic=Q.filter(x=>x.type==='toeic');
const $=id=>document.getElementById(id);
CHAPTERS.forEach(([n,name,s,e])=>{let o=document.createElement('option');o.value=n;o.textContent=`Chapter ${n}｜${name}（Day ${s}${s===e?'':'–'+e}）`; $('chapter').appendChild(o);});
let hist=JSON.parse(localStorage.getItem('kikuCompleteHist')||'{"total":0,"correct":0,"wrong":[],"review":{}}');
hist.review ||= {};
const intervals=[10*60*1000,2*60*60*1000,2*24*60*60*1000,7*24*60*60*1000,21*24*60*60*1000];
function save(){localStorage.setItem('kikuCompleteHist',JSON.stringify(hist));stats();}
function dueIds(){let now=Date.now();return Object.entries(hist.review).filter(([id,v])=>v.due<=now).map(([id])=>Number(id));}
function stats(){$('stTotal').textContent=hist.total;$('stCorrect').textContent=hist.correct;$('stRate').textContent=(hist.total?Math.round(hist.correct/hist.total*100):0)+'%';$('stDue').textContent=dueIds().length;}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
let session=[],idx=0,answered=false,limit=null;
function poolFor(mode){
 if(mode==='all') return core;
 if(mode==='toeic') return toeic;
 if(mode==='wrong') return Q.filter(x=>hist.wrong.includes(x.id));
 if(mode==='due') {let ids=dueIds();return Q.filter(x=>ids.includes(x.id));}
 return core.filter(x=>x.ch===Number($('chapter').value));
}
function start(quick=false,forcedMode=null){
 let mode=forcedMode||$('mode').value, pool=poolFor(mode);
 if(!pool.length){alert(mode==='due'?'今すぐ復習する問題はありません。':'このモードで出題できる問題がありません。');return;}
 session=shuffle(pool); if(quick) session=session.slice(0,10); idx=0;$('quiz').classList.remove('hidden');show();$('quiz').scrollIntoView({behavior:'smooth',block:'start'});
}
function show(){
 answered=false;let x=session[idx],c=CHAPTERS.find(v=>v[0]===x.ch);
 $('bar').style.width=`${idx/session.length*100}%`;
 $('meta').innerHTML=`<span class="badge">${x.type==='toeic'?'TOEIC類題':'基本'}</span>${idx+1} / ${session.length}　Chapter ${x.ch} ${c[1]}　Day ${x.day}`;
 $('question').textContent=x.q;$('choices').innerHTML='';$('result').className='';$('result').innerHTML='';$('next').classList.add('hidden');
 x.c.forEach((t,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=`${String.fromCharCode(65+i)}. ${t}`;b.addEventListener('click',()=>answer(i,b));$('choices').appendChild(b);});
}
function answer(i,b){
 if(answered)return;answered=true;let x=session[idx],btns=[...document.querySelectorAll('#choices .choice')];btns.forEach(z=>z.disabled=true);btns[x.a].classList.add('correct');
 hist.total++; let rv=hist.review[x.id]||{stage:0,due:0};
 if(i===x.a){
   hist.correct++;hist.wrong=hist.wrong.filter(id=>id!==x.id);
   rv.stage=Math.min(rv.stage+1,intervals.length-1);rv.due=Date.now()+intervals[rv.stage];
   $('result').className='result ok';$('result').innerHTML=`正解！<div class="ex">${x.e}</div>`;
 }else{
   b.classList.add('wrong');if(!hist.wrong.includes(x.id))hist.wrong.push(x.id);
   rv.stage=0;rv.due=Date.now()+intervals[0];
   $('result').className='result ng';$('result').innerHTML=`不正解。正解は ${String.fromCharCode(65+x.a)}。<div class="ex">${x.e}</div><div class="ex due">約10分後に復習へ回します。</div>`;
 }
 hist.review[x.id]=rv;save();$('next').textContent=idx===session.length-1?'結果を見る':'次の問題';$('next').classList.remove('hidden');
}
function next(){
 if(idx<session.length-1){idx++;show();}else{$('bar').style.width='100%';$('meta').textContent=`${session.length}問 終了`;$('question').textContent='テスト完了！';$('choices').innerHTML='';$('result').className='result ok';$('result').innerHTML=`学習履歴を保存しました。復習時刻になった問題は「今日の復習」から出せます。`;$('next').classList.add('hidden');stats();}
}
$('start').addEventListener('click',()=>start(false));$('quick').addEventListener('click',()=>start(true));$('next').addEventListener('click',next);$('reviewNow').addEventListener('click',()=>start(false,'due'));
$('reset').addEventListener('click',()=>{if(confirm('回答履歴・復習予定をすべてリセットしますか？')){hist={total:0,correct:0,wrong:[],review:{}};save();}});
stats();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
}
</script>
